server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: springboot-files
          uri: lb://SPRINGBOOT-SERVICE
          predicates:
            - Path=/api/v1/files/**
        - id: springboot-health
          uri: lb://SPRINGBOOT-SERVICE
          predicates:
            - Path=/api/v1/health
        - id: fastapi-chat
          uri: http://localhost:8000
          predicates:
            - Path=/api/v1/chat/**
        - id: fastapi-ingest
          uri: http://localhost:8000
          predicates:
            - Path=/api/v1/ingest/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway